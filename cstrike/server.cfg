
// =====================================================
// CS 1.6 - CSRaiz
// Configuração padrão de servidor
// ReHLDS + ReGameDLL
// =====================================================

// ---------- SERVIDOR ----------
hostname "csraiz.xyz | de_inferno 24/7"

rcon_password ""

sv_password ""

sv_lan 0

// ---------- FPS / PERFORMANCE ----------
fps_max 100
sys_ticrate 100

// ---------- REDE ----------
sv_maxrate 100000
sv_minrate 25000

sv_maxupdaterate 102
sv_minupdaterate 30

sv_maxcmdrate 105
sv_mincmdrate 30

sv_cmdrate 105
sv_updaterate 102
rate 100000

// ---------- LATÊNCIA ----------
sv_unlag 1
sv_maxunlag 0.5

// ---------- VOZ ----------
sv_voiceenable 1
sv_alltalk 1

// ---------- JOGO ----------
mp_autokick 0
mp_autocrosshair 0
mp_autoteambalance 1
mp_buytime 0.25
mp_c4timer 35
mp_chattime 10
mp_consistency 1
mp_fadetoblack 0
mp_flashlight 1
mp_footsteps 1
mp_forcecamera 0
mp_forcechasecam 0
mp_freezetime 0
mp_friendlyfire 0
mp_limitteams 2
mp_maxrounds 0
mp_roundtime 2.5
mp_startmoney 800
mp_timelimit 30
mp_tkpunish 0
mp_winlimit 0

// ---------- LOG ----------
log on
mp_logdetail 0

// ---------- DOWNLOAD ----------
sv_allowdownload 1
sv_allowupload 1

// ---------- SPECTADOR ----------
allow_spectators 1
mp_fadetoblack 0

// ---------- MAPAS ----------
mapchangecfgfile server.cfg

