// =====================================================
// CS 1.6 - https://www.legadocs.top/
// Configuração padrão de servidor - 32 SLOTS
// ReHLDS + ReGameDLL
// =====================================================

// ---------- SERVIDOR ----------
hostname "Hostname| www.legadocs.top"

rcon_password ""

sv_password ""

sv_lan 0

// ---------- FPS / PERFORMANCE ----------
fps_max 1000
sys_ticrate 1000

// ---------- REDE ----------
sv_maxrate 30000
sv_minrate 10000

sv_maxupdaterate 100
sv_minupdaterate 30

sv_maxcmdrate 101
sv_mincmdrate 30

// ---------- LATÊNCIA ----------
sv_unlag 1
sv_maxunlag 0.5

// ---------- VOZ ----------
sv_voiceenable 1
sv_alltalk 1

// ---------- JOGO ----------
mp_autokick 0
mp_autocrosshair 0
mp_autoteambalance 1
mp_buytime 0.25
mp_c4timer 35
mp_chattime 10
mp_consistency 1
mp_fadetoblack 0
mp_flashlight 0
mp_footsteps 1
mp_forcecamera 0
mp_forcechasecam 0
mp_freezetime 0
mp_friendlyfire 0
mp_limitteams 2
mp_maxrounds 0
mp_roundtime 2.5
mp_startmoney 800
mp_timelimit 0
mp_tkpunish 0
mp_winlimit 0

// ---------- LOG ----------
log on
mp_logdetail 0

// ---------- FASTDOWLOAD ----------
sv_downloadurl "http://82.27.38.3:8181"
sv_allowdownload 1
sv_allowupload 1

// ---------- SPECTADOR ----------
allow_spectators 1
mp_fadetoblack 0

// ---------- MAPAS ----------
mapchangecfgfile server.cfg

// ---------- MASTER SERVERS ----------
exec masters.cfg

// =====================================================
// FIM
// =====================================================
