name: Publicar base CS 1.6

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Compactar base
        run: |
          tar -cJf /tmp/cs16-base.tar.xz \
            --exclude='.git' \
            --exclude='.github' \
            -C "$GITHUB_WORKSPACE" .

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          ssh-keyscan -H 82.27.38.3 167.148.161.246 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Testar acesso às VPSs
        run: |
          for VPS in 82.27.38.3 167.148.161.246; do
            echo "Testando $VPS..."
            ssh \
              -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              github-deploy@"$VPS" \
              'test -w /srv/gameap/template && echo "Acesso à pasta template confirmado"'
          done

      - name: Enviar base para as duas VPSs
        run: |
          for VPS in 82.27.38.3 167.148.161.246; do
            echo "Publicando base em $VPS..."

            scp \
              -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              /tmp/cs16-base.tar.xz \
              github-deploy@"$VPS":/srv/gameap/template/cs16-base.tar.xz.tmp

            ssh \
              -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              github-deploy@"$VPS" \
              'mv /srv/gameap/template/cs16-base.tar.xz.tmp /srv/gameap/template/cs16-base.tar.xz && chmod 644 /srv/gameap/template/cs16-base.tar.xz && ls -lh /srv/gameap/template/cs16-base.tar.xz'
          done
