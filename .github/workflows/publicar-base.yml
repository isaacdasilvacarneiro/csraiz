name: Publicar base CS 1.6

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Compactar base
        run: |
          tar -cJf /tmp/cs16-base.tar.xz \
            --exclude='.git' \
            --exclude='.github' \
            -C "$GITHUB_WORKSPACE" .

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          ssh-keyscan -H 82.27.38.3 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Testar acesso à VPS
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            github-deploy@82.27.38.3 \
            'test -w /srv/gameap/template && echo "Acesso à pasta template confirmado"'

      - name: Enviar base para template
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            /tmp/cs16-base.tar.xz \
            github-deploy@82.27.38.3:/srv/gameap/template/cs16-base.tar.xz.tmp

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            github-deploy@82.27.38.3 \
            'mv /srv/gameap/template/cs16-base.tar.xz.tmp /srv/gameap/template/cs16-base.tar.xz && chmod 644 /srv/gameap/template/cs16-base.tar.xz && ls -lh /srv/gameap/template/cs16-base.tar.xz'
